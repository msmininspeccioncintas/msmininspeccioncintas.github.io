  <style>:root{--teal: #106470;--teal2: #0098aa;--gris: #36424a;--naranja: #e55302;--bg: #eef2f4;--card: #ffffff;--text: #1b262c;--muted: #5d6b73;--border: #c9d3d8;--ok: #1a7f4b;--err: #c13832}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:0 0 28px;-webkit-text-size-adjust:100%}.wrap{max-width:720px;margin:0 auto;padding:0 12px}.brand{background:#fff;border-bottom:4px solid var(--naranja);padding:10px 12px;text-align:center}.brand img{height:46px;max-width:100%;object-fit:contain;display:block;margin:0 auto}.brand h1{margin:8px 0 0;font-size:1rem;line-height:1.25;color:var(--teal);letter-spacing:.02em}.status-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:.85rem;margin:12px 0;background:var(--gris);color:#fff}.status-online{color:#7fe3a8;font-weight:600}.status-offline{color:#ffb0a8;font-weight:600}.pend-btn{background:none;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:5px 10px;font-size:.82rem;cursor:pointer}.seccion{background:var(--teal);color:#fff;font-weight:700;font-size:.85rem;padding:7px 12px;border-radius:8px 8px 0 0;margin-top:14px}.card{background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 8px 8px;padding:12px}.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width: 480px){.fila{grid-template-columns:1fr;gap:0}}.form-group{margin-bottom:12px}label{display:block;font-size:.78rem;font-weight:700;margin-bottom:4px;color:var(--gris);text-transform:uppercase;letter-spacing:.02em}.ayuda{font-size:.78rem;color:var(--muted);margin-top:3px;min-height:1em}input,select,textarea{width:100%;padding:11px 10px;border-radius:6px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:1rem;font-family:inherit}textarea{resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--teal2);outline-offset:1px}input[readonly]{background:#eef2f4;color:#33434b}.btn{width:100%;padding:14px;background:var(--naranja);color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px}.btn:disabled{background:#93a1a8;cursor:default}.dos-btn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.dos-btn .btn{margin-top:0;padding:14px 6px}.btn.blanco{background:#fff;color:var(--teal);border:2px solid var(--teal2)}.btn.blanco:disabled{background:#fff;color:#93a1a8;border-color:#c9d3d8}.foto-acciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn-sec{padding:12px 8px;background:#fff;color:var(--teal);border:2px solid var(--teal2);border-radius:8px;font-size:.92rem;font-weight:700;cursor:pointer}.btn-sec:disabled{color:#93a1a8;border-color:#c9d3d8;cursor:default}.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.foto{position:relative;aspect-ratio:4 / 3;border-radius:6px;overflow:hidden;background:#dfe6e9;border:1px solid var(--border)}.foto img{width:100%;height:100%;object-fit:cover;display:block}.foto button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:none;background:#000000a6;color:#fff;font-size:16px;line-height:1;cursor:pointer}.foto span{position:absolute;left:4px;bottom:3px;font-size:.7rem;color:#fff;background:#0000008c;padding:1px 5px;border-radius:4px}.oculto{display:none!important}#toast{position:fixed;left:12px;right:12px;bottom:14px;max-width:696px;margin:0 auto;padding:12px 14px;border-radius:8px;color:#fff;font-size:.92rem;background:var(--gris);box-shadow:0 4px 14px #00000040;z-index:20}#toast.ok{background:var(--ok)}#toast.err{background:var(--err)}.panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}.panel h3{margin:0 0 6px;font-size:.9rem;color:var(--teal)}.pend{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #e3e9ec}.pend small{color:var(--err);display:block}.pend div.acc{display:flex;gap:6px;flex-shrink:0}.mini{border:1px solid var(--border);background:#fff;border-radius:6px;padding:6px 9px;font-size:.8rem;cursor:pointer;color:var(--text)}.mini.rojo{color:var(--err);border-color:var(--err)}.barra-der{display:flex;gap:6px;align-items:center}.hist-buscar{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;margin-bottom:4px;box-sizing:border-box}.pend b{color:var(--teal)}.pend .sub{color:#5f6b72;font-size:.78rem;display:block;margin-top:2px}.aviso-edit{background:#fff6d6;border:1px solid #e0b300;color:#5a4600;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}.aviso-edit .mini{margin-top:8px}

<style>#velo.icc,.cargando.icc{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b254580;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:icc-entra .2s ease-out}#velo.icc.oculto,.cargando.icc.oculto{display:none}.icc-caja{width:min(300px,100%);background:#fff;border-radius:18px;padding:22px 22px 16px;box-shadow:0 18px 50px #0b254559;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#14213d;font:700 15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.icc-caja #veloTxt,.icc-caja #cargTxt{min-height:1.35em}.icc-cinta{position:relative;width:200px;height:74px;flex:none}.icc-cinta:before{content:"";position:absolute;left:0;right:0;top:30px;height:40px;box-sizing:border-box;border:4px solid #1F4E8C;border-radius:20px}.icc-cinta:after{content:"";position:absolute;left:20px;right:20px;top:30px;height:4px;background:repeating-linear-gradient(90deg,#8FB0DA 0 8px,transparent 8px 18px);animation:icc-banda .6s linear infinite}.icc-cinta i{position:absolute;top:36px;width:28px;height:28px;border-radius:50%;box-sizing:border-box;border:3px solid #1F4E8C;background:conic-gradient(#1f4e8c 0 12%,#eaf1fb 0 25%,#1f4e8c 0 37%,#eaf1fb 0 50%,#1f4e8c 0 62%,#eaf1fb 0 75%,#1f4e8c 0 87%,#eaf1fb 0);animation:icc-gira 1.2s linear infinite}.icc-cinta i:first-child{left:6px}.icc-cinta i:nth-child(2){right:6px}.icc-cinta b{position:absolute;left:22px;top:19px;width:13px;height:11px;background:#e35205;border-radius:45% 55% 40% 60%;opacity:0;animation:icc-mineral 2.4s linear infinite}.icc-cinta b:nth-of-type(2){width:10px;height:9px;background:#8a6a4f;animation-delay:-.8s}.icc-cinta b:nth-of-type(3){width:12px;height:10px;background:#b84305;animation-delay:-1.6s}.icc-barra{position:relative;width:100%;height:4px;border-radius:4px;background:#eaf1fb;overflow:hidden}.icc-barra:after{content:"";position:absolute;top:0;bottom:0;width:35%;border-radius:4px;background:#e35205;animation:icc-avance 1.4s ease-in-out infinite}.icc-marca{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#5a6478}.icc-en{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 16px;text-align:center;color:#14213d;font:700 14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.icc-en small{display:block;font-weight:500;color:#5a6478;margin-top:4px}@keyframes icc-entra{0%{opacity:0}}@keyframes icc-gira{to{transform:rotate(360deg)}}@keyframes icc-banda{to{background-position:18px 0}}@keyframes icc-mineral{0%{transform:translate(0) rotate(0);opacity:0}8%{opacity:1}78%{transform:translate(140px) rotate(0);opacity:1}to{transform:translate(168px,34px) rotate(80deg);opacity:0}}@keyframes icc-avance{0%{left:-35%}to{left:100%}}@media (prefers-reduced-motion: reduce){.icc-cinta i,.icc-cinta:after,.icc-cinta b,.icc-barra:after{animation-duration:4s}}
</style>

<body>

  <div class="brand">
    <img id="logoApp" alt="msmin by SGS · Codelco">
    <h1 id="tituloApp">REPORTE DE DESVIACIONES OPERACIONALES DCH - GEL</h1>
  </div>

  <div class="wrap">
    <div class="status-bar">
      <span id="net-status" class="status-online">● En línea</span>
      <div class="barra-der">
        <button type="button" class="pend-btn" id="btnHist">📂 Reportes anteriores</button>
        <button type="button" class="pend-btn" id="btnPend">Pendientes: 0</button>
      </div>
    </div>

    <div class="panel oculto" id="panelHist">
      <h3>Reportes anteriores (descargar PDF o corregir)</h3>
      <input type="search" class="hist-buscar" id="histBuscar" placeholder="Buscar por equipo, título, semana o folio">
      <div id="listaHist"></div>
    </div>

    <div class="aviso-edit oculto" id="avisoEdit"></div>

    <div class="panel oculto" id="panelPend">
      <h3>Reportes pendientes de envío</h3>
      <div id="listaPend"></div>
      <button type="button" class="mini" id="btnSync" style="margin-top:8px">Enviar ahora</button>
    </div>

    <form id="reportForm" novalidate>

      <div class="form-group" style="margin-top:4px">
        <label for="tituloGeneral">Título general</label>
        <input type="text" id="tituloGeneral" maxlength="110" placeholder="ej: Daño en Correa Transportadora 210CV01" required>
      </div>

      <div class="fila">
        <div class="form-group">
          <label for="equipo">Equipo</label>
          <select id="equipo" required><option value="">Cargando equipos...</option></select>
        </div>
        <div class="form-group">
          <label for="componente">Componente</label>
          <input type="text" id="componente" maxlength="60" placeholder="ej: Correa transportadora" required>
        </div>
      </div>

      <div class="fila">
        <div class="form-group">
          <label for="gerencia">Gerencia / Superintendencia</label>
          <input type="text" id="gerencia" readonly placeholder="Se completa al elegir el equipo" tabindex="-1">
        </div>
        <div class="form-group">
          <label for="area">Área / Proceso</label>
          <input type="text" id="area" readonly placeholder="Se completa al elegir el equipo" tabindex="-1">
        </div>
      </div>

      <div class="fila">
        <div class="form-group">
          <label for="fechaHora">Fecha / Hora del evento</label>
          <input type="datetime-local" id="fechaHora" required>
          <div class="ayuda" id="fechaTexto"></div>
        </div>
        <div class="form-group">
          <label for="semana">Semana</label>
          <input type="text" id="semana" maxlength="6" placeholder="ej: W40" required>
          <div class="ayuda">Se calcula sola desde la fecha.</div>
        </div>
      </div>

      <div class="fila">
        <div class="form-group">
          <label for="tiempoDetencion">Tiempo de detención (horas)</label>
          <input type="number" id="tiempoDetencion" step="0.01" min="0.01" max="9999" inputmode="decimal" placeholder="ej: 2.5" required>
        </div>
        <div class="form-group">
          <label for="perdidaEstimada">Pérdida estimada (KTon)</label>
          <input type="text" id="perdidaEstimada" readonly placeholder="Se calcula sola" tabindex="-1">
        </div>
      </div>

      <div class="seccion">I. DETALLE DE LA PÉRDIDA</div>
      <div class="card">
        <div class="form-group">
          <label for="descripcionPerdida">Descripción de la pérdida</label>
          <textarea id="descripcionPerdida" rows="5" maxlength="1200" required></textarea>
        </div>

        <label>Registro fotográfico (máx. <span id="maxFotosTxt">8</span> fotos) — <span id="contFotos">0 de 8</span></label>
        <div class="foto-acciones">
          <button type="button" class="btn-sec" id="btnCamara">📷 Tomar foto</button>
          <button type="button" class="btn-sec" id="btnArchivo">📁 Cargar archivos</button>
        </div>
        <input type="file" id="inCamara" accept="image/*" capture="environment" class="oculto">
        <input type="file" id="inArchivo" accept="image/*" multiple class="oculto">
        <div class="fotos" id="fotos"></div>
      </div>

      <div class="seccion">II. NIVEL DE IMPACTO</div>
      <div class="card">
        <div class="fila">
          <div class="form-group">
            <label for="nivelImpacto">Nivel de impacto</label>
            <select id="nivelImpacto" required></select>
          </div>
          <div class="form-group">
            <label for="kpiAfectado">KPI de desempeño afectado</label>
            <select id="kpiAfectado" required></select>
          </div>
        </div>
      </div>

      <div class="seccion">ACCIÓN INMEDIATA</div>
      <div class="card">
        <div class="form-group">
          <label for="accionInmediata">Acción inmediata (una acción por línea)</label>
          <textarea id="accionInmediata" rows="4" maxlength="900" required></textarea>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label for="reportadoPor">Reportado por (opcional)</label>
          <input type="text" id="reportadoPor" maxlength="60" placeholder="Nombre de quien reporta">
        </div>
      </div>

      <div class="dos-btn">
        <button type="button" class="btn blanco" id="btnPdf">📄 GENERAR PDF</button>
        <button type="submit" class="btn" id="btnSubmit">💾 GUARDAR</button>
      </div>
    </form>
  </div>
