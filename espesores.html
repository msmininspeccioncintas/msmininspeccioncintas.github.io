<style>:root{--azul:#27408B;--azul-osc:#1B2D66;--azul-suave:#E8ECF7;--naranja:#E8590C;--fondo:#F3F5F9;--tarjeta:#fff;--linea:#D5DAE5;--borde-campo:#AEB6C8;--texto:#172033;--tenue:#5A6478;--ok:#1E8E4E;--ok-suave:#E3F4EA;--alerta:#B26A00;--alerta-suave:#FFF3D6;--critico:#C62828;--critico-suave:#FDE7E7;--r:10px;--ancho:1120px}*{box-sizing:border-box}html,body{margin:0}body{background:var(--fondo);color:var(--texto);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}button,input,select,textarea{font:inherit;color:inherit}a{color:var(--azul)}.oculto{display:none!important}.tenue{color:var(--tenue);font-size:13.5px}.cab{position:sticky;top:0;z-index:20;background:var(--tarjeta);border-bottom:3px solid var(--naranja)}.cab-in{max-width:var(--ancho);margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}.cab img{display:block;height:38px;width:auto}.cab h1{flex:1;min-width:150px;margin:0;font-size:17px;font-weight:700;color:var(--azul-osc)}.estado{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:5px 10px;cursor:pointer;background:var(--azul-suave);color:var(--azul-osc);font-size:13px;font-weight:600}.estado i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tenue)}.estado.on i{background:var(--ok)}.estado.off i{background:var(--critico)}.estado.pend{background:var(--alerta-suave);color:#6b4100}nav{background:var(--azul)}nav .in{max-width:var(--ancho);margin:0 auto;padding:0 8px;display:flex}nav button{flex:1;max-width:220px;padding:11px 8px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:#c9d2ee;font-size:15px;font-weight:600}nav button.act{color:#fff;border-bottom-color:var(--naranja)}main{max-width:var(--ancho);margin:0 auto;padding:14px 16px 90px}.tar{margin-bottom:14px;padding:14px 16px;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--r)}.tar h2{display:flex;flex-wrap: c);cursor:pointer;font-weight:600}.seg button.act{background:var(--azul);color:#fff}.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}.btn{min-height:42px;padding:9px 14px;background:#fff;color:var(--azul-osc);border:1.5px solid var(--azul);border-radius:8px;cursor:pointer;font-size:14.5px;font-weight:600}.btn.pri{background:var(--azul);color:#fff}.btn.nar{background:var(--naranja);border-color:var(--naranja);color:#fff}.btn.gde{padding:13px 20px;font-size:16px}.btn.mini{min-height:34px;padding:5px 10px;font-size:13px}.btn:disabled{opacity:.5;cursor:default}.zona{margin:12px 0 6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tenue)}.puntos{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}@media (min-width:760px){.puntos{grid-template-columns:repeat(8,1fr)}}.pt{display:flex;flex-direction:column;gap:2px;min-width:0;padding:6px 6px 5px;background:#fff;border:1.5px solid var(--linea);border-radius:8px}.pt .pn{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--tenue)}.pt .pn b{font-size:13px;color:var(--azul-osc)}.pt .pn .ant{padding:1px 5px;border-radius:5px;background:#e9ecf2;color:#3f485b;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}.pt input{width:100%;min-width:0;padding:4px 2px;border:0;border-bottom:2px solid var(--borde-campo);border-radius:0;background:transparent;text-align:center;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.pt input:focus{outline:0;border-bottom-color:var(--azul)}.pt .pa{text-align:center;font-size:10.5px;color:var(--tenue)}.pt.sube{background:var(--alerta-suave);border-color:var(--alerta)}.pt.sube .pn .ant{background:var(--alerta);color:#fff}.pt.crit{background:var(--critico-suave);border-color:var(--critico)}.pt.mal{border-color:var(--critico)}.pt.aj{background:var(--azul-suave);border-color:var(--azul)}.pt .ajb{min-height:30px;padding:5px 2px;border:0;border-radius:6px;background:var(--alerta);color:#fff;cursor:pointer;font-size:12px;font-weight:700}.aviso{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:8px;font-size:14px}.aviso span{flex:1;min-width:200px}.aviso.al{background:var(--alerta-suave);border:1px solid #E6C36A;color:#5a3a00}.aviso.cr{background:var(--critico-suave);border:1px solid #EBA3A3;color:#7a1515}.aviso.inf{background:var(--azul-suave);border:1px solid #B9C5EA;color:var(--azul-osc)}.aviso.ok{background:var(--ok-suave);border:1px solid #A5D8BA;color:#0e4f2e}.resumen{display:grid;gap:8px;margin:12px 0 4px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.resumen div{padding:8px 10px;background:var(--fondo);border-radius:8px}.resumen span{display:block;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--tenue)}.resumen b{font-size:18px;font-variant-numeric:tabular-nums}.perfil{display:block;width:100%;height:auto;margin-top:8px;background:#fff;border:1px solid var(--linea);border-radius:8px}.ley{display:flex;flex-wrap:wrap;gap:14px;margin-top:5px;font-size:12px;color:var(--tenue)}.ley i{display:inline-block;width:18px;height:3px;margin-right:5px;border-radius:2px;vertical-align:middle}.obs{display:grid;gap:8px}.obs .fila{display:grid;gap:6px;padding:8px 10px;border:1px solid var(--linea);border-radius:8px}.obs .fila.proy{background:var(--azul-suave);border-color:#b9c5ea}@media (min-width:760px){.obs .fila{grid-template-columns:230px 1fr 1fr 1fr;align-items:center}.obs .fila.proy{grid-template-columns:230px 1fr}}.obs .fproy b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.obs .fproy small{color:var(--tenue)}.obs .tit{font-size:14px;font-weight:600}.obs .tit small{display:block;font-weight:500;color:var(--tenue)}.obs .prev{grid-column:1/-1;font-size:12px;color:var(--tenue)}.obs .prev.mejor{color:#9c5700}.obs select{width:100%;min-height:40px;padding:8px;background:#fff;border:1px solid var(--borde- <style>#velo.icc,.cargando.icc{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;background:#0b254580;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:icc-entra .2s ease-out}#velo.icc.oculto,.cargando.icc.oculto{display:none}.icc-caja{width:min(300px,100%);background:#fff;border-radius:18px;padding:22px 22px 16px;box-shadow:0 18px 50px #0b254559;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#14213d;font:700 15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.icc-caja #veloTxt,.icc-caja #cargTxt{min-height:1.35em}.icc-cinta{position:relative;width:200px;height:74px;flex:none}.icc-cinta:before{content:"";position:absolute;left:0;right:0;top:30px;height:40px;box-sizing:border-box;border:4px solid #1F4E8C;border-radius:20px}.icc-cinta:after{content:"";position:absolute;left:20px;right:20px;top:30px;height:4px;background:repeating-linear-gradient(90deg,#8FB0DA 0 8px,transparent 8px 18px);animation:icc-banda .6s linear infinite}.icc-cinta i{position:absolute;top:36px;width:28px;height:28px;border-radius:50%;box-sizing:border-box;border:3px solid #1F4E8C;background:conic-gradient(#1f4e8c 0 12%,#eaf1fb 0 25%,#1f4e8c 0 37%,#eaf1fb 0 50%,#1f4e8c 0 62%,#eaf1fb 0 75%,#1f4e8c 0 87%,#eaf1fb 0);animation:icc-gira 1.2s linear infinite}.icc-cinta i:first-child{left:6px}.icc-cinta i:nth-child(2){right:6px}.icc-cinta b{position:absolute;left:22px;top:19px;width:13px;height:11px;background:#e35205;border-radius:45% 55% 40% 60%;opacity:0;animation:icc-mineral 2.4s linear infinite}.icc-cinta b:nth-of-type(2){width:10px;height:9px;background:#8a6a4f;animation-delay:-.8s}.icc-cinta b:nth-of-type(3){width:12px;height:10px;background:#b84305;animation-delay:-1.6s}.icc-barra{position:relative;width:100%;height:4px;border-radius:4px;background:#eaf1fb;overflow:hidden}.icc-barra:after{content:"";position:absolute;top:0;bottom:0;width:35%;border-radius:4px;background:
