  <style>:root{--navy:#0b2545;--azul:#2F5597;--azul-claro:#DAE3F3;--fondo:#EEF1F5;--texto:#1d2330;--muted:#5f6b7a;--rojo:#C00000;--radio:10px}*{box-sizing:border-box}html,body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 Segoe UI,Roboto,Calibri,Arial,sans-serif}.marca{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:4px solid var(--azul);padding:10px 16px}.marca img{height:40px;width:auto;display:block}.marca .tit{flex:1;text-align:center;line-height:1.2}.marca .tit b{display:block;color:var(--navy);font-size:16px;letter-spacing:.3px;text-transform:uppercase}.marca .tit small{color:var(--muted);font-size:12px}main{max-width:900px;margin:0 auto;padding:16px}.caja{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f,0 4px 14px #0000000f;padding:16px;margin-bottom:14px}h2{margin:0 0 12px;font-size:17px;color:var(--navy)}label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid #9AA4B2;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus{outline:2px solid var(--azul);outline-offset:-1px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);padding:10px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.pri{background:var(--azul);color:#fff;width:100%;margin-top:14px;padding:12px}.btn.sm{padding:6px 10px;font-size:13px}.hint{font-size:12.5px;color:var(--muted);margin-top:10px}.error{color:var(--rojo);font-weight:600;margin-top:10px;min-height:1em}.usuario{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.usuario .quien{flex:1;min-width:180px}.usuario .quien small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:4px;padding:1px 8px;font-size:11.5px;font-weight:700;border:1px
