  <style>:root{--navy:#0b2545;--azul:#2F5597;--azul-claro:#DAE3F3;--fondo:#EEF1F5;--texto:#1d2330;--muted:#5f6b7a;--rojo:#C00000;--radio:10px}*{box-sizing:border-box}html,body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 Segoe UI,Roboto,Calibri,Arial,sans-serif}.marca{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:4px solid var(--azul);padding:10px 16px}.marca img{height:40px;width:auto;display:block}.marca .tit{flex:1;text-align:center;line-height:1.2}.marca .tit b{display:block;color:var(--navy);font-size:16px;letter-spacing:.3px;text-transform:uppercase}.marca .tit small{color:var(--muted);font-size:12px}main{max-width:900px;margin:0 auto;padding:16px}.caja{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f,0 4px 14px #0000000f;padding:16px;margin-bottom:14px}h2{margin:0 0 12px;font-size:17px;color:var(--navy)}label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid #9AA4B2;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus{outline:2px solid var(--azul);outline-offset:-1px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);padding:10px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.pri{background:var(--azul);color:#fff;width:100%;margin-top:14px;padding:12px}.btn.sm{padding:6px 10px;font-size:13px}.hint{font-size:12.5px;color:var(--muted);margin-top:10px}.error{color:var(--rojo);font-weight:600;margin-top:10px;min-height:1em}.usuario{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.usuario .quien{flex:1;min-width:180px}.usuario .quien small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:4px;padding:1px 8px;font-size:11.5px;font-weight:700;border:1px solid rgba(0,0,0,.15)}.b-ADMIN{background:#1f3864;color:#fff}.b-EDITOR{background:#92d050}.b-LECTOR{background:#fff4ce}.b-NINGUNO{background:#eee;color:#888}.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.app{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f,0 4px 14px #0000000f;overflow:hidden;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;text-decoration:none;color:inherit}.app:hover,.app:focus{border-color:var(--azul)}.app .cab{background:var(--azul);color:#fff;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}.app .cab b{font-size:15.5px}.app .cab span{font-size:22px}.app .cuerpo{padding:10px 14px 12px;font-size:13.5px;flex:1}.app .pie{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px;flex-wrap:wrap}.app.admin .cab{background:#1f3864}.app.bloq{opacity:.5;cursor:not-allowed}.etq{font-size:11px;color:var(--muted)}.perfil{display:flex;gap:10px;align-items:flex-start;text-transform:none;font-weight:400;letter-spacing:0;font-size:14px;color:var(--texto);border:1px solid #d5dbe3;border-radius:8px;padding:10px;margin:6px 0;cursor:pointer}.perfil input{width:auto;margin-top:3px}.perfil small{color:var(--muted)}.sinsenal{background:#fff4ce;border:1px solid #FFC000;color:#7a5a00;border-radius:8px;padding:8px 12px;margin-bottom:12px;display:none}html.ic-esc .marca{display:none}details.acts{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f;margin-bottom:14px}details.acts>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--azul);border-radius:var(--radio)}details.acts>summary::-webkit-details-marker{display:none}details.acts>summary:after{content:"▾";margin-left:auto;color:var(--muted)}details.acts[open]>summary:after{transform:rotate(180deg)}details.acts>summary small{font-weight:400;color:var(--muted);font-size:12.5px}details.acts .dentro{padding:0 12px 12px}details.acts .caja{box-shadow:none;border:1px solid #E1E6ED}html.ic-esc details.acts,html.ic-esc .solo-cel{display:none}#planta{margin-bottom:14px}html.ic-esc main{max-width:1180px;padding:28px 32px}@media (max-width: 520px){.marca img{height:30px}.marca .tit b{font-size:13px}.marca .tit small{display:none}main{padding:12px}}
