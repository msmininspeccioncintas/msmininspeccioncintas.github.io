  <style>:root{--navy:#0b2545;--azul:#2F5597;--azul-claro:#DAE3F3;--fondo:#EEF1F5;--texto:#1d2330;--muted:#5f6b7a;--rojo:#C00000;--radio:10px}*{box-sizing:border-box}html,body{margin:0;background:var(--fondo);color:var(--texto);font:15px/1.4 Segoe UI,Roboto,Calibri,Arial,sans-serif}.marca{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:4px solid var(--azul);padding:10px 16px}.marca img{height:40px;width:auto;display:block}.marca .tit{flex:1;text-align:center;line-height:1.2}.marca .tit b{display:block;color:var(--navy);font-size:16px;letter-spacing:.3px;text-transform:uppercase}.marca .tit small{color:var(--muted);font-size:12px}main{max-width:900px;margin:0 auto;padding:16px}.caja{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f,0 4px 14px #0000000f;padding:16px;margin-bottom:14px}h2{margin:0 0 12px;font-size:17px;color:var(--navy)}label{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;margin:10px 0 4px}input,select{width:100%;padding:11px 12px;border:1px solid #9AA4B2;border-radius:8px;font:inherit;background:#fff}input:focus,select:focus{outline:2px solid var(--azul);outline-offset:-1px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);padding:10px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.pri{background:var(--azul);color:#fff;width:100%;margin-top:14px;padding:12px}.btn.sm{padding:6px 10px;font-size:13px}.hint{font-size:12.5px;color:var(--muted);margin-top:10px}.error{color:var(--rojo);font-weight:600;margin-top:10px;min-height:1em}.usuario{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.usuario .quien{flex:1;min-width:180px}.usuario .quien small{display:block;color:var(--muted)}.badge{display:inline-block;border-radius:4px;padding:1px 8px;font-size:11.5px;font-weight:700;border:1px rgin:0 0 14px!important}.espGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:14px}.espCard{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;border:1px solid #E1E6EE;border-radius:16px;box-shadow:0 1px 3px #0000001a,0 6px 18px -10px #0f172a2e;overflow:hidden;cursor:pointer;font:inherit;color:var(--texto);text-align:left}.espCard:hover,.espCard:focus-visible{border-color:var(--azul);box-shadow:0 0 0 3px #1f4e8c2e}.espCard .cab{background:#1f4e8c;color:#fff;padding:16px;display:flex;align-items:center;gap:12px}.espCard .cab .ic{width:56px;height:56px;flex:none;border-radius:14px;background:#ffffff1f;display:grid;place-items:center}.espCard .cab .ic svg{width:44px;height:44px}.espCard .cab b{display:block;font-size:18px}.espCard .cab small{opacity:.85;font-size:12.5px}.espCard .cu{padding:12px 16px 6px;font-size:13.5px;flex:1}.espCard .pie{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 14px}.espCard .ir{color:var(--azul);font-weight:700;font-size:14px}.espCard.fut{cursor:default;opacity:.6}.espCard.fut .cab{background:#8a96a8}.espCard.fut:hover{border-color:#e1e6ee;box-shadow:none}.espSec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:16px 0 8px}.app.prox{cursor:default}.app.prox .cab{background:#1f4e8c!important}.app.prox:hover{border-color:transparent!important;transform:none!important}.enprep{font-size:11.5px;font-weight:700;color:#1f4e8c;background:#eaf1fb;border-radius:4px;padding:1px 8px}details.acts{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f;margin-bottom:14px}details.acts>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--azul);border-radius:var(--radio)}details.acts>summary::-webkit-details-marker{display:none}details.acts>summary:after{content:"▾";margin-lef
