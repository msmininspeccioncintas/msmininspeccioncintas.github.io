rgin:0 0 14px!important}.espGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-bottom:14px}.espCard{all:unset;box-sizing:border-box;display:flex;flex-direction:column;background:#fff;border:1px solid #E1E6EE;border-radius:16px;box-shadow:0 1px 3px #0000001a,0 6px 18px -10px #0f172a2e;overflow:hidden;cursor:pointer;font:inherit;color:var(--texto);text-align:left}.espCard:hover,.espCard:focus-visible{border-color:var(--azul);box-shadow:0 0 0 3px #1f4e8c2e}.espCard .cab{background:#1f4e8c;color:#fff;padding:16px;display:flex;align-items:center;gap:12px}.espCard .cab .ic{width:56px;height:56px;flex:none;border-radius:14px;background:#ffffff1f;display:grid;place-items:center}.espCard .cab .ic svg{width:44px;height:44px}.espCard .cab b{display:block;font-size:18px}.espCard .cab small{opacity:.85;font-size:12.5px}.espCard .cu{padding:12px 16px 6px;font-size:13.5px;flex:1}.espCard .pie{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 14px}.espCard .ir{color:var(--azul);font-weight:700;font-size:14px}.espCard.fut{cursor:default;opacity:.6}.espCard.fut .cab{background:#8a96a8}.espCard.fut:hover{border-color:#e1e6ee;box-shadow:none}.espSec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:16px 0 8px}.app.prox{cursor:default}.app.prox .cab{background:#1f4e8c!important}.app.prox:hover{border-color:transparent!important;transform:none!important}.enprep{font-size:11.5px;font-weight:700;color:#1f4e8c;background:#eaf1fb;border-radius:4px;padding:1px 8px}details.acts{background:#fff;border-radius:var(--radio);box-shadow:0 1px 3px #0000001f;margin-bottom:14px}details.acts>summary{cursor:pointer;list-style:none;padding:13px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;border-left:4px solid var(--azul);border-radius:var(--radio)}details.acts>summary::-webkit-details-marker{display:none}details.acts>summary:after{content:"▾";margin-lef
