<style>.m3d{--bg:#0d0f12;--panel:#15181d;--line:#262b33;--fg:#e6e8eb;--mute:#8a929e;--acero:#a9c4dc;--f-tit:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--f-txt:Barlow,"Segoe UI",Arial,sans-serif;--f-num:ui-monospace,Menlo,Consolas,monospace;color-scheme:dark;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-txt);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;text-align:left}.m3d .ficha .bts{display:flex;gap:8px;flex-wrap:wrap}.m3d h2,.m3d h3,.m3d p{color:inherit}.m3d button.pri{background:var(--acero);color:#0d0f12;border-color:var(--acero)}.m3d{max-width:min(980px,100%);min-width:0;box-sizing:border-box;margin:0 auto;display:flex;flex-direction:column;gap:12px}.m3d header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.m3d h1{font:700 22px/1.1 var(--f-tit);letter-spacing:.04em;text-transform:uppercase;margin:0;flex:1 1 auto}.m3d h1 small{display:block;font:500 12px/1.3 var(--f-txt);letter-spacing:0;text-transform:none;color:var(--mute)}.m3d select,.m3d button{font:600 15px var(--f-tit);letter-spacing:.05em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px}.m3d select{min-width:0;max-width:100%}.m3d button{cursor:pointer;text-transform:uppercase}.m3d button[aria-pressed=true]{background:var(--acero);color:#0d0f12;border-color:var(--acero)}.m3d button:focus-visible,.m3d select:focus-visible,.m3d .it:focus-visible{outline:2px solid var(--acero);outline-offset:2px}.m3d .visor{position:relative;height:min(62vh,560px);min-height:320px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#0b0d10;touch-action:none}.m3d .visor canvas{display:block;width:100%;height:100%}.m3d .marca{position:absolute;left:10px;bottom:10px;display:flex;gap:6px;align-items:center;background:#fff;border-radius:6px;padding:4px 7px;pointer-events:none;opacity:.92}.m3d .marca img{height:22px;display:block}@media (max-width:640px){.m3d .marca{bottom:a
